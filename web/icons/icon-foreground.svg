<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Heads Up">
  <title>Heads Up</title>
  <!-- The foreground layer of the Android adaptive icon: no ground of its own —
       that comes from @color/ic_launcher_background — and pulled inside the
       central 66% the launcher guarantees is never cropped. -->
  <g transform="translate(256 256) scale(0.62) translate(-256 -256)">
    <rect x="64" y="252" width="384" height="8" rx="4" fill="#faf8f2" opacity=".22" />
    <rect x="64" y="252" width="272" height="8" rx="4" fill="#faf8f2" opacity=".55" />
    <circle cx="76" cy="256" r="26" fill="#faf8f2" />
    <circle cx="196" cy="256" r="26" fill="#faf8f2" />
    <circle cx="336" cy="256" r="42" fill="#e8813f" />
    <circle cx="404" cy="256" r="17" fill="none" stroke="#faf8f2" stroke-opacity=".45" stroke-width="9" />
    <rect x="436" y="216" width="14" height="80" rx="3" fill="#faf8f2" />
  </g>
</svg>
