name: Request Copilot review

# Requests a GitHub Copilot code review on every pull request as soon as
# it's ready to be looked at. See docs/DECISIONS.md ADR-027 for why this is
# a workflow step rather than the repository-ruleset toggle GitHub also
# offers ("Automatically request Copilot code review" under Settings →
# Rules → Rulesets), and why the request is best-effort rather than a gate.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  request-review:
    # "opened" also fires for a PR opened straight into draft — don't
    # request a review before the author has marked it ready.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Request a review from Copilot
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh pr edit "${{ github.event.pull_request.number }}"
          --repo "${{ github.repository }}"
          --add-reviewer @copilot
