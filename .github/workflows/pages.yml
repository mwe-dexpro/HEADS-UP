name: Deploy to GitHub Pages

# TWO PREREQUISITES, both one-time, both outside this file. Until they are done
# the build succeeds and configure-pages fails with "Get Pages site failed:
# Not Found".
#
#  1. Pages must be enabled for the repository:
#     Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
#  2. Pages must be *allowed* for the repository. Publishing from a PRIVATE repo
#     needs GitHub Pro, Team or Enterprise. On the Free plan the only options are
#     to make the repository public or to deploy somewhere else — Cloudflare
#     Pages and Netlify both serve private repos free. Nothing in dist/ cares
#     which; every path it emits is relative.
#
# Tried and rejected: `enablement: true` on configure-pages, which is supposed to
# create the Pages site from the workflow. The default GITHUB_TOKEN cannot do it
# — "Create Pages site failed: Resource not accessible by integration" — so it
# only turned one clear manual step into one confusing automatic failure.
#
# Once step 1 is done, re-run the last failed run; no new commit is needed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the second one wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
