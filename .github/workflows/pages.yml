name: Deploy to GitHub Pages

# `enablement: true` below lets the first run turn Pages on by itself, using the
# pages: write token — so on a public repository there is nothing to click.
#
# It only works if Pages is available for the repository at all. Publishing from
# a PRIVATE repo needs GitHub Pro, Team or Enterprise; on the Free plan the API
# refuses to create the site and the step fails with the misleading "Create Pages
# site failed: Resource not accessible by integration". If that happens, the repo
# is either private on a free plan — make it public, or deploy to Cloudflare
# Pages or Netlify, both of which serve private repos free — or Actions is not
# permitted to configure Pages, in which case do it by hand:
# Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# Nothing in dist/ cares where it is served from; every path it emits is
# relative, so the same build works at a domain root or under /HEADS-UP/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the second one wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on for this repository if it is not on already.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
