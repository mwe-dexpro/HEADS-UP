name: Deploy web to GitHub Pages

# `enablement: true` below lets the first run turn Pages on by itself (needs
# a public repo on the Free plan — see the prior build's note, carried
# forward in docs/DECISIONS.md ADR-002/ADR-010).
#
# Set the repository variable API_BASE_URL (Settings → Secrets and
# variables → Actions → Variables) to the deployed Worker's URL once
# api-deploy.yml has run at least once — e.g. https://heads-up-api.<sub>.workers.dev.
# It's a public URL, not a secret, but it does need to be right before
# sign-in will work from the deployed site.

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build:web
        env:
          VITE_BASE_PATH: /HEADS-UP/
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
